<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- いちやなぎ一閃 アイコン: 和紙に柳の枝、墨の一閃、朱の落款 -->
  <rect width="512" height="512" rx="96" fill="#f2ead8"/>
  <!-- 柳の枝（上から垂れる） -->
  <g fill="none" stroke="#1d1915" stroke-linecap="round" opacity="0.85">
    <path d="M120 -10 C 112 90, 96 170, 70 250" stroke-width="9"/>
    <path d="M190 -10 C 186 100, 172 200, 150 300" stroke-width="7"/>
    <path d="M262 -10 C 262 70, 254 140, 238 200" stroke-width="6"/>
  </g>
  <!-- 柳の葉 -->
  <g fill="#1d1915" opacity="0.85">
    <ellipse cx="0" cy="0" rx="7" ry="22" transform="translate(98 120) rotate(28)"/>
    <ellipse cx="0" cy="0" rx="7" ry="22" transform="translate(124 160) rotate(-24)"/>
    <ellipse cx="0" cy="0" rx="7" ry="22" transform="translate(80 205) rotate(30)"/>
    <ellipse cx="0" cy="0" rx="6" ry="20" transform="translate(166 150) rotate(26)"/>
    <ellipse cx="0" cy="0" rx="6" ry="20" transform="translate(192 210) rotate(-22)"/>
    <ellipse cx="0" cy="0" rx="6" ry="20" transform="translate(150 262) rotate(24)"/>
    <ellipse cx="0" cy="0" rx="5" ry="18" transform="translate(244 100) rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="5" ry="18" transform="translate(236 160) rotate(22)"/>
  </g>
  <!-- 墨の一閃（左下から右上へ、入りは太く抜けは細く） -->
  <path d="M58 408
           C 70 384, 96 372, 130 360
           C 230 322, 340 260, 470 150
           C 410 240, 310 336, 172 408
           C 132 428, 98 438, 70 436
           C 52 434, 48 420, 58 408 Z"
        fill="#1d1915"/>
  <!-- かすれ -->
  <path d="M150 382 C 250 330, 340 270, 430 196" fill="none" stroke="#f2ead8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- 朱の落款「一」 -->
  <g transform="translate(372 368) rotate(-4)">
    <rect width="88" height="88" rx="10" fill="#b8321f"/>
    <rect x="18" y="38" width="52" height="12" rx="4" fill="#f2ead8"/>
  </g>
</svg>
